name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Two jobs instead of one node × os matrix product so the check-run
# names stay compatible with main's branch protection. Branch protection
# requires the exact names `test (node 20)` and `test (node 22)` — those
# are produced by a single-dimension matrix in the `test` job below.
# The `test-windows` job is the new cross-platform coverage added by the
# 2026-04-15 Windows path-separator fix; its names
# (`test-windows (node 20)` / `test-windows (node 22)`) are distinct so
# branch protection can optionally require them later without renames.
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # paths-filter (below) needs the merge base to diff against
          # for pull_request events; fetch enough history for that.
          fetch-depth: 0

      # Detect whether this push / PR touches anything that the test
      # suite covers. Docs-only changes (markdown, lore/, CHANGELOG)
      # skip `npm test` so a typo fix doesn't burn 2-5 minutes of CI.
      # Typecheck still runs, so any docs change that accidentally
      # touches a code file (e.g. embedded TS in a tutorial) is caught.
      # The job itself still reports success either way, so the
      # `test (node X)` required check at branch protection stays
      # green. See PR description for the safety analysis.
      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'bin/**'
              - 'examples/**'
              - 'templates/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.github/workflows/**'

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # Fail fast if package.json and package-lock.json disagree on the
      # project's own version. `npm ci` validates dependency integrity
      # but does NOT cross-check the top-level `version` field, so a
      # release that bumps package.json but forgets the lockfile passes
      # CI silently (this happened on the 0.2.0 release). This guard
      # closes that gap.
      - name: Verify package-lock.json version matches package.json
        run: |
          node -e '
            const pkg  = require("./package.json");
            const lock = require("./package-lock.json");
            const lockRoot = lock.packages[""].version;
            if (pkg.version !== lock.version || pkg.version !== lockRoot) {
              console.error(
                "version drift: package.json=" + pkg.version +
                " lock.version=" + lock.version +
                " lock.packages[\"\"].version=" + lockRoot
              );
              process.exit(1);
            }
            console.log("versions consistent: " + pkg.version);
          '

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: npm test

      - name: Test (skipped — docs-only changeset)
        if: steps.changes.outputs.code != 'true'
        run: echo "docs-only changeset — no code paths touched, skipping npm test."

  test-windows:
    name: test-windows (node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'bin/**'
              - 'examples/**'
              - 'templates/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.github/workflows/**'

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: npm test

      - name: Test (skipped — docs-only changeset)
        if: steps.changes.outputs.code != 'true'
        shell: bash
        run: echo "docs-only changeset — no code paths touched, skipping npm test."

  # Verify the npm publish artifact stays clean: required files present,
  # develop-only / source-only paths absent. `package.json#files` is the
  # public allow-list; this job pins the contract so a future PR that
  # accidentally drops `bin/` or adds back `substrate/` fails CI.
  # See PR #150 for the original `files` field landing.
  package-artifact:
    name: package artifact (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify pack contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const pack = JSON.parse(require("fs").readFileSync("pack.json", "utf8"));
            const files = pack[0].files.map(f => f.path);
            const REQUIRED = [
              "bin/gate.mjs",
              "bin/guild.mjs",
              "bin/agora.mjs",
              "bin/devil.mjs",
              "bin/ctx.mjs",
              "dist/src/interface/gate/index.js",
              "package.json",
              "README.md",
              "README.ja.md",
              "LICENSE",
              "AGENT.md",
              "SECURITY.md",
            ];
            const missing = REQUIRED.filter(r => !files.includes(r));
            if (missing.length > 0) {
              console.error("missing from pack:", missing);
              process.exit(1);
            }
            const FORBIDDEN_PREFIXES = [
              "substrate/",
              "src/",
              "tests/",
              "dist/tests/",
            ];
            const FORBIDDEN_FILES = [
              ".guild-actor",
              ".envrc",
              "CLAUDE.md",
              "tsconfig.json",
              "package-lock.json",
            ];
            const leaked = files.filter(f =>
              FORBIDDEN_PREFIXES.some(p => f.startsWith(p)) ||
              FORBIDDEN_FILES.includes(f)
            );
            if (leaked.length > 0) {
              console.error("leaked into pack:", leaked);
              process.exit(1);
            }
            console.log("pack contents verified:", files.length, "files");
          '
